<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affiliate Vendor Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <div class="bg-orb orb-a" aria-hidden="true"></div>
  <div class="bg-orb orb-b" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <main class="dashboard">
    <header class="hero">
      <div class="hero-top">
        <div>
          <p class="kicker">Vendor Intelligence</p>
          <h1>Affiliate Dashboard</h1>
        </div>
        <div class="industries-filter">
          <p class="filter-label">Industries:</p>
          <div id="industriesList" class="industries-buttons"></div>
        </div>
      </div>
      <p class="subtitle">
        Search by category, vendor name, or service. Type <strong>insurance</strong> to see all insurance-ready partners.
      </p>

      <div class="search-wrap">
        <label for="searchInput" class="sr-only">Search vendors</label>
        <input
          id="searchInput"
          type="text"
          placeholder="Try: insurance, legal, finance, education..."
          autocomplete="off"
        />
        <span class="search-icon" aria-hidden="true">⌕</span>
      </div>

      <div class="quick-tags" id="quickTags">
        <button type="button" data-tag="insurance">Insurance</button>
        <button type="button" data-tag="finance">Finance</button>
        <button type="button" data-tag="health">Health</button>
        <button type="button" data-tag="legal">Legal</button>
        <button type="button" data-tag="education">Education</button>
      </div>
    </header>

    <section class="status-row">
      <p id="resultsInfo">Loading vendors...</p>
      <div class="status-actions">
        <button id="addVendorBtn" type="button" class="btn-add-vendor">+ Add Vendor</button>
        <button id="clearSearch" type="button">Clear</button>
      </div>
    </section>

    <div id="vendorModal" class="modal" style="display: none;">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add New Vendor</h2>
          <button type="button" class="modal-close" id="closeModal" aria-label="Close">&times;</button>
        </div>
        <form id="addVendorForm" class="vendor-form">
          <div class="form-group">
            <label for="vendorName">Vendor Name *</label>
            <input type="text" id="vendorName" placeholder="e.g., My Media Network" required />
          </div>

          <div class="form-group">
            <label for="vendorBriefing">Briefing / Description *</label>
            <textarea id="vendorBriefing" placeholder="Describe what your vendor does..." rows="3" required></textarea>
          </div>

          <div class="form-group">
            <label for="vendorGoodAt">Good At (comma-separated)</label>
            <input type="text" id="vendorGoodAt" placeholder="e.g., Mobile Marketing, Lead Gen, User Acquisition" />
          </div>

          <div class="form-group">
            <label for="vendorCategories">Categories (comma-separated) *</label>
            <input type="text" id="vendorCategories" placeholder="e.g., Finance, Insurance, Gaming, Travel" required />
          </div>

          <div class="form-group">
            <label for="vendorModels">Pricing Models (comma-separated)</label>
            <input type="text" id="vendorModels" placeholder="e.g., CPA, CPI, CPM, CPC" />
          </div>

          <div class="form-group">
            <label for="vendorEmail">Email *</label>
            <input type="email" id="vendorEmail" placeholder="contact@vendor.com" required />
          </div>

          <div class="form-group">
            <label for="vendorWebsite">Website</label>
            <input type="url" id="vendorWebsite" placeholder="https://vendor.com" />
          </div>

          <div class="form-group">
            <label for="vendorContactName">Contact Person Name</label>
            <input type="text" id="vendorContactName" placeholder="e.g., John Doe" />
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" id="cancelForm">Cancel</button>
            <button type="submit" class="btn-primary">Add Vendor</button>
          </div>
        </form>
      </div>
    </div>

    <section id="vendorGrid" class="vendor-grid" aria-live="polite"></section>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  </main>

  <template id="vendorCardTemplate">
    <article class="vendor-card">
      <div class="vendor-head">
        <div>
          <h2 class="vendor-name"></h2>
          <p class="vendor-type"></p>
        </div>
        <span class="vendor-score"></span>
      </div>
      <p class="vendor-blurb"></p>
      <div class="meta-row">
        <p class="meta-label">Good At</p>
        <div class="chip-group strengths"></div>
      </div>
      <div class="meta-row">
        <p class="meta-label">Categories</p>
        <div class="chip-group categories"></div>
      </div>
      <div class="meta-row">
        <p class="meta-label">Pricing Models</p>
        <div class="chip-group models"></div>
      </div>
      <div class="meta-row contact-block">
        <p class="meta-label">Contact Details</p>
        <div class="contact-list">
          <p class="contact-line website"></p>
          <p class="contact-line contact"></p>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js?v=8"></script>
</body>
</html>
